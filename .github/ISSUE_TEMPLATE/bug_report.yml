name: Bug report
description: Something in Lungo does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did and what went wrong. A terminal screenshot of the footer helps.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The steps, your `lungo` settings, the terminal width and other extensions you use.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you run (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Pi version, OS and terminal
      placeholder: e.g. Pi 1.0.2, macOS 15.5, Ghostty
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Layout and truncation
        - Token totals and cache hit rate
        - Throughput
        - Context usage
        - Nerd Font icons
        - Settings
        - Docs
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. If you know where the cause is, say so.
